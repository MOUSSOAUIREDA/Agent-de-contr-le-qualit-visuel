    // Générateur SVG pour les bouteilles d'échantillons
    function createBottleSvg({ bubble = false, blackSpot = false, oil = false, thread = false, grain = false }) {

      const svg = `

  <!-- Corps de la bouteille en verre -->
  <g id="glass-bottle">
    <path d="

    <ellipse cx="200" cy="46" rx="31" ry="5" fill="#065f46" stroke="#34d399" stroke-width="1.2" />

    <!-- Reflet spéculaire gauche -->
    <path d="
      M 178,75

    <path d="M 300,220 L 300,430" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" />

`;
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg.trim());
    }

    // Échantillons de test prêts à l'emploi (Démonstration & Validation)
    const MOCK_SAMPLES = [
      {
        id: "sample-bubble",
        name: "Bouteille avec Bulle",
        tag: "Bubble (Exemple Officiel)",
        description: "Conforme à l'exemple contrat/exemple.json avec détection d'une bulle sur le col.",
        data: {
          image: "bouteille_avec_defaut.jpg",
          status: "defects_detected",
          detections: [
            {
              label: "Bubble",
              confidence: 0.94,
              bbox: [120, 80, 200, 160]
            }
          ]
        },
        imageUrl: createBottleSvg({ bubble: true })
      },
      {
        id: "sample-clean",
        name: "Bouteille Saine",
        tag: "Sans Défaut (Conforme)",
        description: "Bouteille saine conforme (status: no_defect, 0 détection) selon le contrat.",
        data: {
          image: "bouteille_saine.jpg",
          status: "no_defect",
          detections: []
        },
        imageUrl: createBottleSvg({})
      },
      {
        id: "sample-multi",
        name: "Bouteille Multi-Défauts",
        tag: "3 Défauts Critiques",
        description: "Bouteille présentant une tache noire, de l'huile résiduelle et un grain de trempe.",
        data: {
          image: "bouteille_multi_defauts.jpg",
          status: "defects_detected",
          detections: [
            {
              label: "Black spot",
              confidence: 0.91,
              bbox: [140, 180, 175, 215]
            },
            {
              label: "Oil",
              confidence: 0.87,
              bbox: [220, 260, 290, 320]
            },
            {
              label: "Quenched grain",
              confidence: 0.79,
              bbox: [95, 340, 145, 390]
            }
          ]
        },
        imageUrl: createBottleSvg({ blackSpot: true, oil: true, grain: true })
      },
      {
        id: "sample-thread",
        name: "Bouteille avec Fil de Verre",
        tag: "Plastering thread",
        description: "Filament/cordon de verre le long de l'épaule et du corps de la bouteille.",
        data: {
          image: "bouteille_fil_verre.jpg",
          status: "defects_detected",
          detections: [
            {
              label: "Plastering thread",
              confidence: 0.88,
              bbox: [160, 110, 240, 290]
            }
          ]
        },
        imageUrl: createBottleSvg({ thread: true })
      }
    ];

    // Logique heuristique de simulation pour les images importées par l'utilisateur
    function generateMockDetection(fileName, imgWidth = 400, imgHeight = 500) {
      const classes = ["Bubble", "Plastering thread", "Black spot", "Oil", "Quenched grain"];
      let hash = 0;
      for (let i = 0; i < fileName.length; i++) {
        hash = (hash << 5) - hash + fileName.charCodeAt(i);
        hash |= 0;
      }
      const hasDefect = Math.abs(hash) % 5 !== 0;

      if (!hasDefect) {
        return {
          image: fileName,
          status: "no_defect",
          detections: []
        };
      }

      const count = (Math.abs(hash) % 3) + 1;
      const detections = [];
      for (let i = 0; i < count; i++) {
        const label = classes[(Math.abs(hash) + i) % classes.length];
        const confidence = parseFloat((0.74 + (Math.abs(hash * (i + 1)) % 24) / 100).toFixed(2));
        const boxW = Math.max(30, Math.floor(imgWidth * (0.12 + 0.05 * i)));
        const boxH = Math.max(30, Math.floor(imgHeight * (0.10 + 0.04 * i)));
        const xMin = Math.floor(imgWidth * 0.25 + (Math.abs(hash + i * 37) % Math.floor(imgWidth * 0.4)));
        const yMin = Math.floor(imgHeight * 0.15 + (Math.abs(hash + i * 73) % Math.floor(imgHeight * 0.6)));

        detections.push({
          label,
          confidence: Math.min(0.99, confidence),
          bbox: [xMin, yMin, Math.min(imgWidth - 5, xMin + boxW), Math.min(imgHeight - 5, yMin + boxH)]
        });
      }

      return {
        image: fileName,
        status: "defects_detected",
        detections
      };
    }

    // Composant Principal
    function App() {
      const [mode, setMode] = useState("mock"); // "mock" ou "live"
      const [apiUrl, setApiUrl] = useState("http://localhost:8000");
      const [isBackendOnline, setIsBackendOnline] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      // Données de l'inspection active
      const [currentImage, setCurrentImage] = useState(null);
      const [currentFileName, setCurrentFileName] = useState("");
      const [imageDimensions, setImageDimensions] = useState({ width: 400, height: 500 });
      const [analysisResult, setAnalysisResult] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState(null);

      // Contrôles interactifs du Canvas
      const [hoveredDefect, setHoveredDefect] = useState(null);
      const [selectedDefect, setSelectedDefect] = useState(null);
      const [minConfidence, setMinConfidence] = useState(0.5);
      const [showBoxes, setShowBoxes] = useState(true);
      const [showLabels, setShowLabels] = useState(true);
      const [showConf, setShowConf] = useState(true);
      const [activeClasses, setActiveClasses] = useState(null);

      // Historique et Compteurs
      const [history, setHistory] = useState([]);
      const [stats, setStats] = useState({ total: 0, passed: 0, failed: 0 });

      // Canvas ref & image
      const canvasRef = useRef(null);
      const [zoom, setZoom] = useState(1);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const [isPanning, setIsPanning] = useState(false);
      const [startPan, setStartPan] = useState({ x: 0, y: 0 });
      const [cursorCoords, setCursorCoords] = useState({ x: 0, y: 0 });
      const imageElementRef = useRef(null);

      // Tester la disponibilité du backend au montage
      useEffect(() => {
        const checkHealth = async () => {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 1500);
            const res = await fetch(`${apiUrl}/docs`, { method: "HEAD", signal: controller.signal })
              .catch(() => fetch(`${apiUrl}/health`, { method: "GET", signal: controller.signal }));
            clearTimeout(timeoutId);
            if (res && (res.ok || res.status === 200 || res.status === 404)) {
              setIsBackendOnline(true);
            }
          } catch {
            setIsBackendOnline(false);
          }
        };
        checkHealth();
      }, [apiUrl]);

      // Dessin sur Canvas
      useEffect(() => {
        if (!currentImage || !canvasRef.current) return;
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = currentImage;
        img.onload = () => {
          imageElementRef.current = img;
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext("2d");

          canvas.width = img.naturalWidth || 400;
          canvas.height = img.naturalHeight || 500;

          // Nettoyer
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Dessiner l'image originale
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          // Dessiner les boîtes englobantes
          if (showBoxes && analysisResult && analysisResult.detections) {
            analysisResult.detections.forEach((det, idx) => {
              if (det.confidence < minConfidence) return;
              if (activeClasses && !activeClasses.includes(det.label)) return;

              const [xMin, yMin, xMax, yMax] = det.bbox;
              const w = xMax - xMin;
              const h = yMax - yMin;
              const meta = DEFECT_CLASSES[det.label] || { color: "#38bdf8" };
              const isHovered = hoveredDefect === idx;
              const isSelected = selectedDefect === idx;

              ctx.save();

              // Boîte englobante avec lueur
              if (isHovered || isSelected) {
                ctx.shadowColor = meta.color;
                ctx.shadowBlur = 18;
                ctx.strokeStyle = meta.color;
                ctx.lineWidth = 4;
                ctx.fillStyle = `${meta.color}25`;
                ctx.fillRect(xMin, yMin, w, h);
              } else {
                ctx.shadowColor = "transparent";
                ctx.shadowBlur = 0;
                ctx.strokeStyle = meta.color;
                ctx.lineWidth = 2.5;
                ctx.fillStyle = `${meta.color}15`;
                ctx.fillRect(xMin, yMin, w, h);
              }
              ctx.strokeRect(xMin, yMin, w, h);

              // Réticules / coins HUD
              const corner = Math.min(12, Math.min(w, h) / 3);
              ctx.strokeStyle = "#ffffff";
              ctx.lineWidth = 2;

              ctx.beginPath();
              ctx.moveTo(xMin, yMin + corner); ctx.lineTo(xMin, yMin); ctx.lineTo(xMin + corner, yMin);
              ctx.moveTo(xMax - corner, yMin); ctx.lineTo(xMax, yMin); ctx.lineTo(xMax, yMin + corner);
              ctx.moveTo(xMin, yMax - corner); ctx.lineTo(xMin, yMax); ctx.lineTo(xMin + corner, yMax);
              ctx.moveTo(xMax - corner, yMax); ctx.lineTo(xMax, yMax); ctx.lineTo(xMax, yMax - corner);
              ctx.stroke();

              // Étiquette
              if (showLabels) {
                const labelText = showConf
                  ? `${det.label} ${(det.confidence * 100).toFixed(0)}%`
                  : det.label;

                ctx.font = "bold 13px 'Inter', sans-serif";
                const metrics = ctx.measureText(labelText);
                const pad = 8;
                const tagH = 22;
                const tagW = metrics.width + pad * 2;
                let tagX = xMin;
                let tagY = yMin - tagH;
                if (tagY < 0) tagY = yMin + 2;

                ctx.fillStyle = isHovered || isSelected ? meta.color : "rgba(15, 23, 42, 0.94)";
                ctx.beginPath();
                ctx.roundRect(tagX, tagY, tagW, tagH, 4);
                ctx.fill();

                ctx.strokeStyle = meta.color;
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = isHovered || isSelected ? "#030712" : "#f8fafc";
                ctx.textBaseline = "middle";
                ctx.fillText(labelText, tagX + pad, tagY + tagH / 2);
              }

              ctx.restore();
            });
          }
        };
      }, [currentImage, analysisResult, hoveredDefect, selectedDefect, minConfidence, showBoxes, showLabels, showConf, activeClasses]);

      // Gestion du Pan / Drag
      const handleMouseDown = (e) => {
        if (e.button === 0 && zoom > 1) {
          setIsPanning(true);
          setStartPan({ x: e.clientX - pan.x, y: e.clientY - pan.y });
        }
      };

      const handleMouseMove = (e) => {
        if (isPanning) {
          setPan({ x: e.clientX - startPan.x, y: e.clientY - startPan.y });
        }
        if (canvasRef.current) {
          const rect = canvasRef.current.getBoundingClientRect();
          const scaleX = canvasRef.current.width / rect.width;
          const scaleY = canvasRef.current.height / rect.height;
          setCursorCoords({
            x: Math.max(0, Math.min(canvasRef.current.width, Math.round((e.clientX - rect.left) * scaleX))),
            y: Math.max(0, Math.min(canvasRef.current.height, Math.round((e.clientY - rect.top) * scaleY)))
          });
        }
      };

      const handleMouseUp = () => setIsPanning(false);

      const handleCanvasClick = (e) => {
        if (!canvasRef.current || isPanning || !analysisResult?.detections) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const scaleX = canvasRef.current.width / rect.width;
        const scaleY = canvasRef.current.height / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;

        for (let i = analysisResult.detections.length - 1; i >= 0; i--) {
          const [xMin, yMin, xMax, yMax] = analysisResult.detections[i].bbox;
          if (clickX >= xMin && clickX <= xMax && clickY >= yMin && clickY <= yMax) {
            setSelectedDefect(i === selectedDefect ? null : i);
            return;
          }
        }
        setSelectedDefect(null);
      };

      // Traiter un échantillon rapide
      const handleSampleSelect = (sample) => {
        setError(null);
        setCurrentImage(sample.imageUrl);
        setCurrentFileName(sample.data.image);
        setAnalysisResult(sample.data);
        setSelectedDefect(null);
        setHoveredDefect(null);
        setZoom(1);
        setPan({ x: 0, y: 0 });

        const isPassed = sample.data.status === "no_defect" || sample.data.detections.length === 0;
        setHistory((prev) => [
          {
            timestamp: Date.now(),
            timeStr: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
            imageUrl: sample.imageUrl,
            data: sample.data
          },
          ...prev
        ]);
        setStats((prev) => ({
          total: prev.total + 1,
          passed: prev.passed + (isPassed ? 1 : 0),
          failed: prev.failed + (isPassed ? 0 : 1)
        }));
      };

      // Traiter l'upload d'un fichier utilisateur
      const handleFileUpload = async (file) => {
        setError(null);
        if (!file) return;

        // Validation du format (EF-02, EF-03)
        const validFormats = ["image/jpeg", "image/png", "image/webp", "image/bmp"];
        const isValid = validFormats.includes(file.type) || /\.(jpe?g|png|webp|bmp)$/i.test(file.name);
        if (!isValid) {
          setError(`Format de fichier non pris en charge (${file.type || "inconnu"}). Veuillez importer une image JPG, PNG, WEBP ou BMP.`);
          return;
        }

        if (file.size > 20 * 1024 * 1024) {
          setError("L'image est trop volumineuse. La taille maximale acceptée est de 20 Mo.");
          return;
        }

        setIsLoading(true);
        setCurrentFileName(file.name);

        const reader = new FileReader();
        reader.onload = async (event) => {
          const url = event.target.result;
          setCurrentImage(url);
          setZoom(1);
          setPan({ x: 0, y: 0 });

          const testImg = new Image();
          testImg.src = url;
          testImg.onload = async () => {
            const dims = { width: testImg.naturalWidth || 400, height: testImg.naturalHeight || 500 };
            setImageDimensions(dims);

            try {
              let result;
              if (mode === "mock") {
                // Simulation avec latence réseau réaliste
                await new Promise((r) => setTimeout(r, 400));
                result = generateMockDetection(file.name, dims.width, dims.height);
              } else {
                // Tentative d'appel FastAPI (Membre B)
                const formData = new FormData();
                formData.append("file", file);
                const resp = await fetch(`${apiUrl}/predict`, {
                  method: "POST",
                  body: formData
                });
                if (!resp.ok) {
                  throw new Error(`Erreur API ${resp.status}: ${resp.statusText}`);
                }
                result = await resp.json();
              }

              setAnalysisResult(result);
              setSelectedDefect(null);
              setHoveredDefect(null);

              const isPassed = result.status === "no_defect" || result.detections.length === 0;
              setHistory((prev) => [
                {
                  timestamp: Date.now(),
                  timeStr: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
                  imageUrl: url,
                  data: result
                },
                ...prev
              ]);
              setStats((prev) => ({
                total: prev.total + 1,
                passed: prev.passed + (isPassed ? 1 : 0),
                failed: prev.failed + (isPassed ? 0 : 1)
              }));
            } catch (err) {
              console.warn("Bascule en mode simulation:", err.message);
              // Fallback gracieux en simulation
              const fallback = generateMockDetection(file.name, dims.width, dims.height);
              setAnalysisResult(fallback);
              setError(`Backend FastAPI non disponible (${err.message}). Affichage des résultats en mode simulation locale.`);
            } finally {
              setIsLoading(false);
            }
          };
        };
        reader.readAsDataURL(file);
      };

      // Exporter JSON conforme au contrat
      const handleExportJson = () => {
        if (!analysisResult) return;
        const cleanPayload = {
          image: analysisResult.image || currentFileName,
          status: analysisResult.status,
          detections: (analysisResult.detections || []).map((d) => ({
            label: d.label,
            confidence: d.confidence,
            bbox: d.bbox
          }))
        };
        const blob = new Blob([JSON.stringify(cleanPayload, null, 2)], { type: "application/json" });
        const dlUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = dlUrl;
        a.download = `controle_qualite_${(analysisResult.image || "bouteille").replace(/\.[^/.]+$/, "")}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(dlUrl);
      };

      const toggleClassFilter = (c) => {
        setActiveClasses((prev) => {
          if (!prev) {
            const all = Object.keys(DEFECT_CLASSES);
            return all.filter((x) => x !== c);
          }
          if (prev.includes(c)) {
            const next = prev.filter((x) => x !== c);
            return next.length === 0 ? null : next;
          }
          return [...prev, c];
        });
      };

      const visibleDetections = (analysisResult?.detections || []).filter(
        (d) => d.confidence >= minConfidence && (!activeClasses || activeClasses.includes(d.label))
      );

      const isHealthy = analysisResult && (analysisResult.status === "no_defect" || analysisResult.detections.length === 0);

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          {/* Header */}

              {/* Logo & Titre */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-teal-500 to-emerald-500 flex items-center justify-center shadow-lg shadow-cyan-500/20 ring-1 ring-white/20">
                  <svg className="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M9 3h6v3a4 4 0 0 1 1 2.8V19a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V8.8A4 4 0 0 1 9 6V3z" />
                    <line x1="8" y1="12" x2="16" y2="12" />
                    <circle cx="12" cy="15" r="1.5" fill="currentColor" />
                  </svg>
                </div>
                <div>
                  <div className="flex items-center gap-2">

                    <span className="text-xs px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 font-medium">
                      Contrôle Qualité Visuel
                    </span>
                    <span className="hidden sm:inline-block text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 font-mono">

                    </span>
                  </div>
                  <p className="text-xs text-slate-400">

                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                </button>

            </div>

            </div>

          {/* Contenu Principal */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col space-y-6">

                  </p>
                </div>

                {/* Boîte de drop */}
                <div
                  onDragOver={(e) => e.preventDefault()}
                  onDrop={(e) => {
                    e.preventDefault();
                    if (e.dataTransfer.files?.[0]) handleFileUpload(e.dataTransfer.files[0]);
                  }}
                  className="border-2 border-dashed border-slate-700 hover:border-cyan-500/60 rounded-2xl p-8 sm:p-12 text-center bg-slate-900/40 hover:bg-slate-900/70 transition-all cursor-pointer relative group"
                  onClick={() => document.getElementById("file-upload").click()}
                >
                  <input
                    id="file-upload"
                    type="file"
                    accept=".jpg,.jpeg,.png,.webp,.bmp,image/*"

                      if (e.target.files?.[0]) handleFileUpload(e.target.files[0]);

                  />

                  <div className="max-w-md mx-auto space-y-4">
                    <div className="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-slate-800 to-slate-700 flex items-center justify-center text-cyan-400 group-hover:scale-110 group-hover:text-cyan-300 transition-transform border border-slate-600/50 shadow-inner">
                      <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                      </svg>
                    </div>

                    <div>
                      <h3 className="text-base font-semibold text-white">
                        Glissez-déposez l'image d'une bouteille ici
                      </h3>
                      <p className="text-xs text-slate-400 mt-1">
                        ou <span className="text-cyan-400 underline font-medium">parcourez vos fichiers</span> depuis votre poste
                      </p>
                    </div>

                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700 text-xs text-slate-400 font-mono">
                      <span>JPG</span> • <span>PNG</span> • <span>WEBP</span> • <span>BMP (Max 20 Mo)</span>

                  {isLoading && (
                    <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center gap-3">
                      <div className="w-10 h-10 border-3 border-cyan-400/30 border-t-cyan-400 rounded-full animate-spin"></div>

                {/* Message d'erreur (EF-03) */}

                  <div className="p-4 rounded-xl bg-rose-950/40 border border-rose-500/40 text-rose-300 flex items-start gap-3">
                    <svg className="w-5 h-5 flex-shrink-0 text-rose-400 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />

                    <div className="flex-1 text-xs">

                    </div>
                    <button onClick={() => setError(null)} className="text-rose-400 hover:text-white font-bold">✕</button>
                  </div>

                {/* Échantillons prédéfinis */}
                <div className="space-y-3">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
                      <h4 className="text-xs font-semibold uppercase tracking-wider text-slate-300">
                        Échantillons de Démonstration (Prêts pour le test immédiat)
                      </h4>
                    </div>
                    <span className="text-xs text-slate-500 font-mono">contrat/exemple.json</span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    {MOCK_SAMPLES.map((sample) => (
                      <button

                        className="flex flex-col text-left p-3 rounded-xl bg-slate-900/60 hover:bg-slate-800/80 border border-slate-800 hover:border-cyan-500/40 transition-all group"
                      >
                        <div className="w-full h-24 rounded-lg bg-slate-950 flex items-center justify-center overflow-hidden mb-2.5 border border-slate-800">
                          <img src={sample.imageUrl} alt={sample.name} className="h-full object-contain group-hover:scale-105 transition-transform" />
                        </div>
                        <div className="flex items-center justify-between gap-1 mb-1">
                          <span className="text-xs font-semibold text-white group-hover:text-cyan-300 truncate">
                            {sample.name}
                          </span>
                          <span className={`text-[10px] px-1.5 py-0.5 rounded font-mono font-medium ${
                            sample.data.status === "no_defect"

              </div>
            ) : (
              /* Écran d'analyse interactif */
              <div className="flex-1 flex flex-col space-y-6">
                {/* Bannière de Verdict (EF-07 à EF-10) */}
                {analysisResult && (
                  <div className={`relative overflow-hidden rounded-2xl p-5 border shadow-xl flex items-center gap-4 ${
                    isHealthy

                      : "bg-gradient-to-r from-rose-950/70 via-slate-900 to-slate-900 border-rose-500/40 shadow-rose-950/40"

                    <div className={`w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0 ${

                    }`}>
                      {isHealthy ? (

                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />

                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                          </svg>
                          Changer d'image
                        </button>
                      </div>
                    </div>

                    {/* Zone Canvas avec drag/pan */}
                    <div
                      onMouseDown={handleMouseDown}
                      onMouseMove={handleMouseMove}
                      onMouseUp={handleMouseUp}
                      className="relative overflow-hidden flex items-center justify-center p-4 min-h-[460px] bg-gradient-to-b from-slate-950 via-slate-900/50 to-slate-950 select-none cursor-crosshair"
                    >
                      <div
                        style={{
                          transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`,
                          transformOrigin: "center center",
                          transition: isPanning ? "none" : "transform 0.15s ease-out"
                        }}
                        className="relative shadow-2xl rounded-lg overflow-hidden ring-1 ring-slate-800"
                      >
                        <canvas
                          ref={canvasRef}
                          onClick={handleCanvasClick}
                          className="max-h-[560px] max-w-full object-contain block"
                        />
                      </div>
                    </div>

                    {/* Coordonnées en direct */}
                    <div className="px-4 py-2 bg-slate-900/90 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-400">
                      <div className="flex items-center gap-3">
                        <span className="font-mono">
                          Curseur : X: <strong className="text-slate-200">{cursorCoords.x}</strong>, Y: <strong className="text-slate-200">{cursorCoords.y}</strong>
                        </span>
                        <span className="text-slate-600">•</span>
                        <span>{analysisResult?.detections?.length || 0} anomalie(s)</span>
                      </div>
                      <div className="text-slate-500 hidden sm:block">
                        Cliquez sur une bounding box pour la cibler
                      </div>
                    </div>
                  </div>

                  {/* Colonne Droite : Filtres et Liste des défauts (5 col) */}
                  <div className="lg:col-span-5 space-y-4">
                    {/* Boîte des Filtres */}
                    <div className="p-4 rounded-xl bg-slate-900/80 border border-slate-800 space-y-3">
                      <div className="flex items-center justify-between text-xs">
                        <span className="font-semibold text-slate-300">Filtres d'Affichage</span>
                        <span className="text-cyan-400 font-mono font-medium">
                          Seuil min : {(minConfidence * 100).toFixed(0)}%
                        </span>
                      </div>

                      <input
                        type="range"
                        min="0.4"
                        max="0.99"
                        step="0.01"
                        value={minConfidence}
                        onChange={(e) => setMinConfidence(parseFloat(e.target.value))}
                        className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-400"
                      />

                      <div className="pt-2 border-t border-slate-800/80 grid grid-cols-3 gap-2 text-[11px] text-slate-400">
                        <label className="flex items-center gap-1.5 cursor-pointer select-none">
                          <input
                            type="checkbox"
                            checked={showBoxes}
                            onChange={(e) => setShowBoxes(e.target.checked)}
                            className="rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-0"
                          />
                          <span>Boîtes</span>
                        </label>
                        <label className="flex items-center gap-1.5 cursor-pointer select-none">
                          <input
                            type="checkbox"
                            checked={showLabels}
                            onChange={(e) => setShowLabels(e.target.checked)}
                            className="rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-0"
                          />
                          <span>Étiquettes</span>
                        </label>
                        <label className="flex items-center gap-1.5 cursor-pointer select-none">
                          <input
                            type="checkbox"
                            checked={showConf}
                            onChange={(e) => setShowConf(e.target.checked)}
                            className="rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-0"
                          />
                          <span>Scores %</span>
                        </label>
                      </div>

                      {/* Catégories de défauts */}
                      <div className="pt-2 border-t border-slate-800/80">
                        <div className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-2">
                          Filtrer les 5 classes ciblées
                        </div>
                        <div className="flex flex-wrap gap-1.5">
                          {Object.keys(DEFECT_CLASSES).map((className) => {
                            const meta = DEFECT_CLASSES[className];
                            const isChecked = !activeClasses || activeClasses.includes(className);
                            return (
                              <button
                                key={className}
                                onClick={() => toggleClassFilter(className)}
                                className={`px-2 py-1 rounded text-[10px] font-medium transition-all flex items-center gap-1 border ${
                                  isChecked
                                    ? "bg-slate-800 text-white border-slate-700"
                                    : "bg-slate-950/40 text-slate-500 border-slate-800/60 line-through"
                                }`}
                              >
                                <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: meta.color }}></span>
                                {className}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>

                    {/* Liste des détections */}
                    <div className="space-y-2.5">
                      <div className="flex items-center justify-between text-xs px-1">
                        <span className="font-semibold text-slate-300">
                          Défauts Détectés ({visibleDetections.length})
                        </span>
                        <span className="text-slate-500 text-[11px] font-mono">
                          contrat/schema.py
                        </span>
                      </div>

                      {visibleDetections.length === 0 ? (
                        <div className="p-6 text-center rounded-xl bg-slate-900/40 border border-slate-800/80">
                          <p className="text-xs text-slate-400">
                            Aucun défaut visible avec les filtres actuels.
                          </p>
                        </div>
                      ) : (
                        visibleDetections.map((det, index) => {
                          const meta = DEFECT_CLASSES[det.label] || { color: "#38bdf8", fr: det.label };
                          const isHovered = hoveredDefect === index;
                          const isSelected = selectedDefect === index;
                          const [xMin, yMin, xMax, yMax] = det.bbox;

                          return (
                            <div
                              key={`${det.label}-${index}`}
                              onMouseEnter={() => setHoveredDefect(index)}
                              onMouseLeave={() => setHoveredDefect(null)}
                              onClick={() => setSelectedDefect(isSelected ? null : index)}
                              className={`p-3 rounded-xl border transition-all cursor-pointer ${
                                isSelected
                                  ? "bg-slate-800/90 border-cyan-400 shadow-lg shadow-cyan-500/10"
                                  : isHovered
                                  ? "bg-slate-800/70 border-slate-600"
                                  : "bg-slate-900/60 border-slate-800 hover:border-slate-700"
                              }`}
                            >
                              <div className="flex items-center justify-between gap-2 mb-1.5">
                                <div className="flex items-center gap-2">
                                  <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: meta.color }}></span>
                                  <span className="text-xs font-bold text-white">{det.label}</span>
                                  <span className="text-[10px] text-slate-400">({meta.fr})</span>
                                </div>
                                <span
                                  className="px-2 py-0.5 rounded text-[11px] font-mono font-bold"
                                  style={{
                                    backgroundColor: `${meta.color}20`,
                                    color: meta.color,
                                    border: `1px solid ${meta.color}50`
                                  }}
                                >
                                  {(det.confidence * 100).toFixed(1)}%
                                </span>
                              </div>

                              <div className="w-full bg-slate-800 rounded-full h-1.5 mb-2 overflow-hidden">
                                <div
                                  className="h-1.5 rounded-full transition-all"
                                  style={{
                                    width: `${det.confidence * 100}%`,
                                    backgroundColor: meta.color
                                  }}
                                ></div>
                              </div>

                              <div className="grid grid-cols-2 gap-1.5 pt-1.5 border-t border-slate-800/60 text-[10px] font-mono text-slate-400">
                                <div className="bg-slate-950/60 px-2 py-1 rounded flex justify-between">
                                  <span>BBox :</span>
                                  <span className="text-slate-200">[{xMin}, {yMin}, {xMax}, {yMax}]</span>
                                </div>
                                <div className="bg-slate-950/60 px-2 py-1 rounded flex justify-between">
                                  <span>Taille :</span>
                                  <span className="text-slate-200">{xMax - xMin} × {yMax - yMin} px</span>
                                </div>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>

                    {/* Boutons d'export et impression */}
                    <div className="pt-2 flex gap-2">
                      <button
                        onClick={handleExportJson}
                        className="flex-1 py-2 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white border border-slate-700 text-xs font-semibold transition-colors flex items-center justify-center gap-1.5"
                      >
                        <svg className="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Exporter JSON (Contrat)
                      </button>
                      <button
                        onClick={() => window.print()}
                        className="py-2 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold"
                        title="Imprimer"
                      >
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                        </svg>
                      </button>
                    </div>
                  </div>
                </div>

                {/* Historique de la session */}
                {history.length > 0 && (
                  <div className="mt-8 pt-6 border-t border-slate-800 space-y-3">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-indigo-400"></span>
                        <h3 className="text-xs font-semibold uppercase tracking-wider text-slate-300">
                          Historique de la Session ({history.length})
                        </h3>
                      </div>
                      <button
                        onClick={() => setHistory([])}
                        className="text-[11px] text-slate-500 hover:text-slate-300"
                      >
                        Effacer l'historique
                      </button>
                    </div>

                    <div className="flex gap-3 overflow-x-auto pb-2 custom-scrollbar">
                      {history.map((item, idx) => {
                        const pass = item.data.status === "no_defect" || item.data.detections.length === 0;
                        return (
                          <button
                            key={`${item.timestamp}-${idx}`}
                            onClick={() => {
                              setCurrentImage(item.imageUrl);
                              setCurrentFileName(item.data.image);
                              setAnalysisResult(item.data);
                              setSelectedDefect(null);
                            }}
                            className="flex-shrink-0 w-48 p-2.5 rounded-xl bg-slate-900/60 hover:bg-slate-800 border border-slate-800 text-left transition-all flex items-center gap-2.5 group"
                          >
                            <div className="w-12 h-14 rounded-lg bg-slate-950 flex items-center justify-center overflow-hidden border border-slate-800 flex-shrink-0">
                              <img src={item.imageUrl} alt={item.data.image} className="h-full object-contain" />
                            </div>
                            <div className="min-w-0 flex-1">
                              <p className="text-xs font-medium text-white truncate group-hover:text-cyan-300">
                                {item.data.image}
                              </p>
                              <div className="flex items-center gap-1.5 mt-0.5">
                                <span className={`text-[9px] px-1.5 py-0.2 rounded font-mono font-bold ${
                                  pass
                                    ? "bg-emerald-500/10 text-emerald-400 border border-emerald-500/30"
                                    : "bg-rose-500/10 text-rose-400 border border-rose-500/30"
                                }`}>
                                  {pass ? "PASS" : "REJET"}
                                </span>
                                <span className="text-[10px] text-slate-500 font-mono">{item.timeStr}</span>
                              </div>
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Modal Configuration API */}
          {isSettingsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="w-full max-w-md rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl p-6 space-y-5">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white">Configuration Backend FastAPI</h3>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>
                <div className="space-y-2">
                  <label className="text-xs font-semibold text-slate-300 block">URL de l'API</label>
                  <input
                    type="text"
                    value={apiUrl}
                    onChange={(e) => setApiUrl(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-white font-mono text-xs focus:outline-none focus:border-cyan-500"
                  />
                </div>
                <div className="pt-3 border-t border-slate-800 flex justify-end gap-2">
                  <button onClick={() => setIsSettingsOpen(false)} className="px-4 py-2 rounded-xl text-xs text-slate-400 hover:text-white">
                    Fermer
                  </button>
                  <button onClick={() => setIsSettingsOpen(false)} className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold">
                    Valider
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
